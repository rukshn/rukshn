name: Generate Git Profile Koi

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows you to trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-profile-koi@v1.0.2 # Or point to the latest tag/version
        with:
          login: ${{ github.repository_owner }}
          body: "white" # Optional: body color choice (options include white, black, asagi, tea, gold, platinum)
          output-dir: "koi" # Folder where the images/GIFs will be saved

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update profile koi graphic" && git push)
